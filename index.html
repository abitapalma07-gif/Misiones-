function readProof(file,cb){
  var fail=function(m){cb(null,m)};
  var fr=new FileReader();
  fr.onload=function(){var img=new Image();
    img.onload=function(){
      if(Math.max(img.width,img.height)<300){fail("La foto es muy pequeña. Sube una captura o una foto más grande.");return}
      var s=Math.min(1,720/Math.max(img.width,img.height));
      var w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
      var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      var g=document.createElement("canvas");g.width=17;g.height=16;var gx=g.getContext("2d");gx.drawImage(img,0,0,17,16);
      var px=gx.getImageData(0,0,17,16).data,gray=[],sum=0,sq=0,i,j;
      for(i=0;i<272;i++){var v=0.299*px[i*4]+0.587*px[i*4+1]+0.114*px[i*4+2];gray.push(v);sum+=v;sq+=v*v}
      var mean=sum/272,sd=Math.sqrt(Math.max(0,sq/272-mean*mean));
      if(sd<6){fail("La foto se ve vacía o de un solo color. Sube una captura o una foto real.");return}
      var bits="";for(i=0;i<16;i++)for(j=0;j<16;j++)bits+=gray[i*17+j]>gray[i*17+j+1]?"1":"0";
      var hex="";for(i=0;i<256;i+=4)hex+=parseInt(bits.substr(i,4),2).toString(16);
      cb(c.toDataURL("image/jpeg",0.65),null,hex);
    };
    img.onerror=function(){fail("No se pudo leer esa foto. Prueba con otra.")};img.src=fr.result};
  fr.onerror=function(){fail("No se pudo leer esa foto. Prueba con otra.")};fr.readAsDataURL(file);
}
function hamming(a,b){var d=0;for(var i=0;i<a.length;i++){var x=parseInt(a.charAt(i),16)^parseInt(b.charAt(i),16);while(x){d+=x&1;x>>=1}}return d}

function balance(log){return log.reduce(function(a,e){return a+(e.status==="rev"?0:e.pts)},0)}
function earnedVal(log,before){return log.reduce(function(a,e){return a+((e.pts>0&&e.status!=="rev"&&(!before||e.day<before))?e.pts:0)},0)}
function rng(seed){var h=0;for(var i=0;i<seed.length;i++){h=Math.imul(31,h)+seed.charCodeAt(i)|0}
  return function(){h|=0;h=h+0x6D2B79F5|0;var t=Math.imul(h^h>>>15,1|h);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
var pickMemo={},pickSig="";
function picksFor(date,extra){
  var p=S.profile,sig=p.rel+p.dist+(p.age>=18?"A":"M");
  if(sig!==pickSig){pickMemo={};pickSig=sig}
  var pool=POOL.filter(itemOK),cur=new Date(2026,0,1),prevIds={},end=dayKey(date);
  function base(key){var r=rng(key),sh=shuffle(pool,r);return {sh:sh,n:5+Math.floor(r()*3)}}
  if(date<cur){var b0=base(end);return b0.sh.slice(0,b0.n)}
  for(var i=0;i<5000;i++){
    var key=dayKey(cur),b=base(key);
    var list=pickMemo[key];
    if(!list){list=b.sh.filter(function(m){return !prevIds[m.id]}).slice(0,b.n);pickMemo[key]=list}
    if(key===end){
      var inList={};list.forEach(function(m){inList[m.id]=1});
      return list.concat(b.sh.filter(function(m){return !inList[m.id]&&!prevIds[m.id]}).slice(0,extra));
    }
    prevIds={};list.forEach(function(m){prevIds[m.id]=1});
    cur.setDate(cur.getDate()+1);
  }
  return pickMemo[end]||[];
}
/* El nivel que cuenta para las misiones del día es el que tenías al empezar el día */
function dayLevel(){return levelOf(earnedVal(S.log,dayKey()))}
function todayMissions(){
  var L=dayLevel(),total=dailyTotal(L),picks=picksFor(new Date(),Math.floor((L-1)/2)),base=3,rest=total-base*picks.length;
  var W=picks.reduce(function(a,m){return a+m.w},0)||1;
  var out=picks.map(function(m){var raw=rest*m.w/W,fl=Math.floor(raw);return {id:m.id,cat:m.cat,text:m.text,pts:base+fl,frac:raw-fl,mode:m.mode}});
  var left=total-out.reduce(function(a,m){return a+m.pts},0);
  out.slice().sort(function(a,b){return b.frac-a.frac}).slice(0,left).forEach(function(m){m.pts++});
  var top=0;out.forEach(function(m,i){if(m.pts>out[top].pts)top=i});
  if(out.length)out[top].star=true;
  out.forEach(function(m){delete m.frac});
  return out;
}

function streak(){
  var counts={};S.log.forEach(function(e){if(e.kind==="m")counts[e.day]=(counts[e.day]||0)+1});
  var d=new Date(),n=0;
  if((counts[dayKey(d)]||0)<3)d.setDate(d.getDate()-1);
  while((counts[dayKey(d)]||0)>=3){n++;d.setDate(d.getDate()-1)}
  return n;
}

/* Si un día pasa sin 3 misiones y había racha, se pierden puntos según el nivel */
function settle(){
  var first=null,counts={},pen={};
  S.log.forEach(function(e){if(!first||e.day<first)first=e.day;if(e.kind==="m")counts[e.day]=(counts[e.day]||0)+1;if(e.kind==="p")pen[e.day]=1});
  if(!first)return 0;
  var p=first.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]),today=dayKey(),run=0,lost=0,guard=0;
  while(dayKey(d)<today&&guard++<900){
    var k=dayKey(d),c=counts[k]||0;
    if(c>=3){run++}
    else{
      if(run>=1&&!pen[k]){
        var L=levelOf(earnedVal(S.log,k)),amt=Math.max(0,Math.min(penaltyFor(L),balance(S.log)));
        S.log.push({kind:"p",text:"Perdiste tu racha de "+run+(run===1?" día":" días"),pts:-amt,day:k,ts:new Date(d.getFullYear(),d.getMonth(),d.getDate(),23,59,0).getTime()});
        pen[k]=1;lost+=amt;
      }
      run=0;
    }
    d.setDate(d.getDate()+1);
  }
  if(lost>0)save();
  return lost;
}

function validCost(c){c=parseInt(c,10);return c>=150&&c<=500||c>=600&&c<=1500?c:0}
function handleMsg(text){
  var bad=function(m){return {ok:false,msg:m}};
  var m=/MDA2:([A-Za-z0-9+\/=]+)/.exec(String(text||""));
  if(!m)return bad("No encontré un código válido en ese mensaje.");
  var env;try{env=JSON.parse(decodeURIComponent(escape(atob(m[1]))))}catch(e){return bad("El código está incompleto. Copia el mensaje completo.")}
  if(!env||env.v!==2||typeof env.t!=="string"||typeof env.id!=="string"||typeof env.pair!=="string"||!/^[A-Za-z0-9]{6,20}$/.test(env.pair)||!env.d||typeof env.d!=="object")return bad("Ese código no es válido.");
  if(S.seen.indexOf(env.id)>=0)return bad("Ese mensaje ya se había leído.");
  var from=nm(env.from)||"Tu pareja",d=env.d,t=env.t,res;
  function done(msg){S.seen.push(env.id);S.seen=S.seen.slice(-600);addNews(msg);save();return {ok:true,msg:msg}}
  if(t==="invite"){
    if(S.pairId&&S.pairName)return bad("Ya estás enlazado con "+S.pairName+". Primero desenlaza en Pareja.");
    if(S.pairId===env.pair)return bad("Ese es tu propio código. Mándaselo a tu pareja.");
    var ag=parseInt(d.age,10);
    if(!(ag>=10&&ag<=99)||!RELS[d.rel])return bad("Ese código no es válido.");
    var why=compat(S.profile.age,S.profile.rel,ag,d.rel);
    if(why)return bad(why);
    S.pairId=env.pair;S.pairName=from;S.pairAge=ag;S.pairBand=bandOf(ag);S.pairRel=d.rel;
    setOut("join",{age:S.profile.age,rel:S.profile.rel},"Ya me enlacé contigo, "+from+".");
    return done("Enlazado con "+from+". Mándale el mensaje de confirmación que apareció arriba.");
  }
  if(t==="join"){
    if(!S.pairId||S.pairId!==env.pair||S.pairName)return bad("Ese mensaje no corresponde a tu invitación.");
    var ag2=parseInt(d.age,10);
    if(!(ag2>=10&&ag2<=99)||!RELS[d.rel])return bad("Ese código no es válido.");
    var why2=compat(S.profile.age,S.profile.rel,ag2,d.rel);
    if(why2){S.pairId="";return done("No se pudo enlazar. "+why2)}
    S.pairName=from;S.pairAge=ag2;S.pairBand=bandOf(ag2);S.pairRel=d.rel;
    return done("Listo, ya están enlazados "+S.me+" y "+from+".");
  }
  if(!S.pairId||!S.pairName||S.pairId!==env.pair)return bad("Ese mensaje es de otra pareja o todavía no están enlazados.");
  if(t==="mission"){
    var mt=String(d.text||"").trim().slice(0,90);
    if(!mt||!isClean(mt)||!CATS[d.cat])return bad("Esa misión no se puede aceptar porque tiene palabras que la app no permite.");
    S.customM.push({id:"r"+env.id,cat:d.cat,text:mt,pts:Math.max(1,Math.min(20,parseInt(d.pts,10)||10)),from:from});
    return done(from+" te puso una misión nueva. La ves en Hoy.");
  }
  if(t==="mrep"){
    var rt=String(d.text||"").trim().slice(0,90);
    if(!rt||!isClean(rt)||typeof d.eid!=="number")return bad("Ese mensaje no es válido.");
    if(S.reviews.some(function(x){return x.eid===d.eid}))return bad("Ya tenías esa misión por revisar.");
    S.reviews.push({eid:d.eid,from:from,text:rt,pts:Math.max(1,Math.min(200,parseInt(d.pts,10)||5))});
    return done(from+" te pide revisar una misión. Míralo en Pareja y respóndele.");
  }
  if(t==="mres"){
    var idx=-1;S.log.forEach(function(e,i){if(e.kind==="m"&&e.status==="rev"&&e.ts===d.eid)idx=i});
    if(idx<0)return bad("Esa misión ya no está en revisión.");
    if(d.ok){delete S.log[idx].status;return done(from+" aceptó tu misión. Ganaste +"+S.log[idx].pts+" puntos.")}
    var tx=S.log[idx].text;S.log.splice(idx,1);return done(from+" no aceptó la misión \""+tx+"\". Falta la prueba.");
  }
  if(t==="rprop"){
    var pt=String(d.text||"").trim().slice(0,90),pc=validCost(d.cost);
    if(!pt||!isClean(pt)||!pc||typeof d.id!=="string")return bad("Ese premio no se puede aceptar porque no cumple las reglas de la app.");
    S.proposals.push({id:d.id.slice(0,40),dir:"in",text:pt,cost:pc,status:"nueva",from:from});
    return done(from+" propone un premio. Respóndele en Pareja.");
  }
  if(t==="rres"){
    var pr=S.proposals.filter(function(x){return x.dir==="out"&&x.id===d.id&&x.status==="esperando"})[0];
    if(!pr)return bad("Esa propuesta ya no está esperando respuesta.");
    if(d.res==="ok"){pr.status="aceptada";S.customR.push({id:"x"+pr.id,text:pr.text,cost:pr.cost});return done(from+" aceptó tu premio por "+pr.cost+" puntos. Ya está en Premios.")}
    if(d.res==="counter"){var cc=validCost(d.cost);if(!cc)return bad("El precio que pide no es válido.");pr.status="contra";pr.counter=cc;return done(from+" pide "+cc+" puntos por tu premio. Decide en Pareja.")}
    if(d.res==="no"){pr.status="rechazada";return done(from+" no aceptó tu premio.")}
    return bad("Ese mensaje no es válido.");
  }
  if(t==="rfin"){
    var pi=S.proposals.filter(function(x){return x.dir==="in"&&x.id===d.id&&x.status==="contra"})[0];
    if(!pi)return bad("Esa propuesta ya no está esperando.");
    pi.status=d.res==="ok"?"confirmada":"cancelada";
    return done(d.res==="ok"?from+" aceptó el precio que pediste.":from+" canceló el premio.");
  }
  return bad("Ese mensaje no es válido.");
}

function toggle(mid,proof,hash){
  var all=allMissions();
  var m=all.filter(function(x){return x.id===mid})[0];if(!m)return;
  var k=dayKey(),log=S.log.slice(),idx=-1;
  log.forEach(function(e,i){if(e.kind==="m"&&e.day===k&&e.mid===mid)idx=i});
  if(idx<0&&!proof){toast("Sin foto de prueba no cuenta la misión");return}
  var entry=null;
  if(idx>=0)log.splice(idx,1);
  else{
    entry={kind:"m",mid:mid,text:m.text,pts:m.pts,day:k,ts:Date.now(),proof:proof,hash:hash};
    if(reviewOn())entry.status="rev";
    log.push(entry);
  }
  if(balance(log)<0){toast("Ya gastaste esos puntos en un premio");return}
  S.log=log;save();
  if(entry&&entry.status==="rev"){
    ui.revMsg[entry.ts]=compose("mrep",{eid:entry.ts,text:m.text,pts:m.pts},"Cumplí una misión: \""+m.text+"\" (+"+m.pts+"). Te mando la foto aparte. ¿La aceptas?");
    netSend(ui.revMsg[entry.ts],proof);
    toast(Net.state==="ok"?"Enviada a tu pareja para que la revise":"En revisión: manda el mensaje a tu pareja",3500);
  }else if(entry){toast("+"+m.pts+" puntos")}
  render();
}
function allRewards(){
  var cat=REWARDS.filter(itemOK).map(function(r){return {id:r.id,text:r.text,cost:r.cost,mode:r.mode,lvl:r.lvl}});
  return cat.concat(S.customR.map(function(c){return {id:c.id,text:c.text,cost:c.cost,custom:true,lvl:1}}));
}
function redeem(id){
  var r=allRewards().filter(function(x){return x.id===id})[0];
  if(!r||balance(S.log)<r.cost||levelOf(earnedVal(S.log))<r.lvl)return;
  S.log.push({kind:"r",text:"Premio: "+r.text,pts:-r.cost,day:dayKey(),ts:Date.now()});
  S.pending.push({rid:r.id,text:r.text,cost:r.cost,ts:Date.now()});
  save();ui.confirm=null;ui.lastRedeem=r;render();window.scrollTo(0,0);
}
function applyProfile(px,first){
  function v(id){return document.getElementById(px+id)}
  var me=v("Me").value.trim(),pa=v("Partner").value.trim(),age=parseInt(v("Age").value,10),rel=v("Rel").value,dist=v("Dist").value;
  if(!isClean(me)||!isClean(pa))return NO_MALO;
  if(!me||!pa)return "Escribe tu nombre y el de la otra persona.";
  if(!(age>=10&&age<=99))return "La app es para personas de 10 años o más.";
  var b=bandOf(age);
  if(b==="n"&&isRom(rel))return "Para tu edad la app es solo de amistad o familia.";
  if(S.pairId&&S.pairName){var why=compat(age,rel,S.pairAge,S.pairRel);if(why)return why}
  S.me=me.slice(0,30);S.partner=pa.slice(0,30);
  S.profile={ok:true,age:age,rel:rel,dist:dist==="cerca"?"cerca":"lejos"};
  var rv=document.getElementById(px+"Review");if(rv)S.review=rv.checked;
  save();return null;
}

    if(x.day!==last){var p=x.day.split("-"),dt=new Date(+p[0],+p[1]-1,+p[2]);out+='<div class="day">'+esc(dt.toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"long"}))+'</div>';last=x.day}
    var lab=x.kind==="f"?'Cumplido':x.status==="rev"?'En revisión':(x.pts>0?'+':'')+x.pts;
    out+='<div class="log"><span class="lg">'+(x.proof?'<img class="thumb" alt="Prueba" src="'+x.proof+'">':'')+'<span>'+esc(x.text)+'</span></span><span class="p '+(x.pts<0?'neg':'pos')+'">'+lab+'</span></div>';
  });
  return viewHero()+'<div class="sec"><h2>Niveles</h2><small>Tú vas en el nivel '+L+'</small>'+qbIn('lvl')+'</div>'+qh('lvl')+
    '<div class="panel"><div class="tw"><table class="lv"><thead><tr><th>Nivel</th><th>Desde</th><th>Al día</th><th>Racha</th><th>Premios</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '</div>'+
    '<div class="sec"><h2>Historial</h2>'+qbIn('hist')+'</div>'+qh('hist')+(out?'<div class="panel" style="gap:0">'+out+'</div>':'<div class="empty">Aún no hay movimientos. Completa tu primera misión en la pestaña Hoy.</div>');
}
function viewAjustes(){
  var cm=S.customM.filter(function(c){return !c.from}).map(function(c){return '<div class="log"><span>'+esc(c.text)+' <small style="color:var(--muted)">('+CATS[c.cat]+', +'+c.pts+')</small></span><button class="btn ghost sm" data-a="delM" data-id="'+esc(c.id)+'">Quitar</button></div>'}).join("");
  var opts=Object.keys(CATS).map(function(k){return '<option value="'+k+'">'+CATS[k]+'</option>'}).join("");
  return '<div class="top">'+ICON.heart+'<span>Ajustes</span></div>'+
  '<form class="panel" id="pfForm"><h3>Mi perfil</h3>'+qb('prof')+qh('prof')+profileFields("pf")+
  '<label style="flex-direction:row;align-items:center;gap:10px;color:var(--ink)"><input id="pfReview" type="checkbox" style="width:auto"'+(S.review?' checked':'')+'>(Opcional) Que mi pareja revise mis misiones</label>'+
  '<button class="btn" type="submit">Guardar perfil</button></form>'+
  '<form class="panel" id="mForm"><h3>Crear una misión para mí</h3>'+qb('mform')+qh('mform')+'<p class="hint">Esta semana te quedan '+cmLeft()+' de 5.</p>'+
  '<label>Qué hay que hacer<input id="mText" maxlength="90" required placeholder="Ej: Mándale un audio con su canción favorita"></label>'+
  '<div class="row"><label>Categoría<select id="mCat">'+opts+'</select></label><label>Puntos (máximo 20)<input id="mPts" type="number" min="1" max="20" value="10" required></label></div>'+
  '<button class="btn" type="submit"'+(cmLeft()?'':' disabled')+'>'+(cmLeft()?'Agregar misión':'Ya usaste tus 5 de esta semana')+'</button>'+(cm?'<div>'+cm+'</div>':'')+'</form>'+
  '<div class="panel"><h3>Respaldo del progreso</h3>'+qb('backup')+qh('backup')+'<button class="btn" data-a="backupCopy">Copiar código de respaldo</button><label>Restaurar con un código<textarea id="restoreCode" placeholder="Pega aquí tu código, empieza con MDA1:"></textarea></label><button class="btn ghost" data-a="restoreGo">Restaurar progreso</button></div>'+
  '<div class="panel"><h3>Poner la app en la pantalla de inicio</h3>'+qb('home')+qh('home')+'<p class="hint">Toca el ? para ver los pasos.</p></div>'+
  '<div class="panel"><h3>Guía completa</h3><p class="hint">Todo lo que hace la app, en una sola pantalla.</p><button class="btn" data-a="helpOpen">Ver guía</button></div>'+
  '<div class="panel"><h3>Empezar de cero</h3>'+(ui.resetAsk?'<p style="margin:0">Se borran tus puntos, historial, perfil y misiones propias. También se desenlaza tu pareja.</p><div class="row"><button class="btn" data-a="resetOk">Sí, borrar todo</button><button class="btn ghost" data-a="resetNo">Cancelar</button></div>':'<button class="btn ghost" data-a="resetAsk">Borrar mis puntos y datos</button>')+'</div>';
}
function newsBox(){
  var h="",pend=badgeCount();
  if(S.news.length)h+='<div class="panel"><h3>Novedades de tu pareja</h3>'+qb('news')+qh('news')+S.news.slice().reverse().slice(0,6).map(function(n){return '<div class="log"><span>'+esc(n.text)+'</span></div>'}).join("")+'<button class="btn ghost sm" data-a="clearNews">Entendido, borrar novedades</button></div>';
  if(pend&&ui.tab!=="pareja")h+='<div class="banner">Tienes '+pend+(pend===1?' cosa':' cosas')+' por contestar. <button class="btn sm" data-a="tab" data-id="pareja">Ir a Pareja</button></div>';
  return h;
}
function badgeCount(){
  var n=S.reviews.length;
  S.proposals.forEach(function(p){if((p.dir==="in"&&p.status==="nueva")||(p.dir==="out"&&p.status==="contra"))n++});
  return n;
}
function viewNav(){
  var bc=badgeCount();
  return TABS.map(function(t){return '<button data-a="tab" data-id="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'>'+ICON[t[0]]+'<span>'+t[1]+'</span>'+(t[0]==="pareja"&&bc?'<i class="badge">'+bc+'</i>':'')+'</button>'}).join("");
}
function render(){
  document.body.setAttribute("data-big",(S.profile.ok&&bandOf(S.profile.age)==="m")?"1":"0");
  var nav=document.getElementById("navwrap");
  if(ui.help){document.getElementById("app").innerHTML=viewAyuda();nav.hidden=true;return}
  if(!S.profile.ok){document.getElementById("app").innerHTML=viewRegistro();nav.hidden=true;return}
  nav.hidden=false;
  var v={hoy:viewHoy,premios:viewPremios,pareja:viewPareja,progreso:viewProgreso,ajustes:viewAjustes}[ui.tab]();
  document.getElementById("app").innerHTML=v;
  document.getElementById("nav").innerHTML=viewNav();
}

/* ---------- Eventos ---------- */
function shareText(){
  var m=todayMissions(),d=doneToday(),n=m.filter(function(x){return d[x.id]}).length,L=levelOf(earnedVal(S.log));
  return (S.me?S.me+" aquí. ":"")+"Hoy llevo "+n+" de "+m.length+" misiones y "+balance(S.log)+" puntos (nivel "+L+", "+lvName(L)+"). Racha: "+streak()+" día"+(streak()===1?"":"s")+". ¿Y tú?";
}
function backupCode(){
  var o=JSON.parse(JSON.stringify(S));o.log.forEach(function(e){delete e.proof});
  return "MDA1:"+b64(o);
}
function restoreFrom(c){
  try{
    c=String(c).trim();if(c.indexOf("MDA1:")!==0)return false;
    var o=JSON.parse(decodeURIComponent(escape(atob(c.slice(5)))));
    if(!o||typeof o!=="object"||!Array.isArray(o.log))return false;
    S=clean(o);S.savedAt=Date.now();save();return true;
  }catch(e){return false}
}
function sendOut(type,d,human){setOut(type,d,human);render();window.scrollTo(0,0)}
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-a]");if(!el)return;
  var a=el.getAttribute("data-a"),id=el.getAttribute("data-id");
  var A={
    tab:function(){ui.tab=id;ui.confirm=null;ui.resetAsk=false;ui.unlinkAsk=false;ui.proof=null;ui.view=null;render();window.scrollTo(0,0)},
    open:function(){
      if(doneToday()[id]){ui.view=id;ui.proof=null}else{ui.proof=id;ui.view=null;ui.proofData=null;ui.proofBusy=false;ui.proofErr="";ui.proofHash="";ui.lastFile=null}
      ui.out=null;render();window.scrollTo(0,0);
    },
    proofCancel:function(){ui.proof=null;ui.view=null;ui.proofData=null;ui.proofErr="";render()},
    proofOk:function(){if(ui.proof&&ui.proofData){var pid=ui.proof,pd=ui.proofData,ph=ui.proofHash;ui.proof=null;ui.proofData=null;toggle(pid,pd,ph);var rb=document.querySelector('.revbox');if(rb)rb.scrollIntoView({block:'center'});else window.scrollTo(0,0)}},
    undo:function(){ui.view=null;toggle(id)},
    share:function(){ui.out={title:"Mi progreso",text:shareText()};render();window.scrollTo(0,0)},
    copyOut:function(){
      var t=ui.out?ui.out.text:"";
      copyText(t,function(){toast("Mensaje copiado")},function(){var ta=document.getElementById("outText");if(ta){ta.focus();ta.select()}toast("Selecciona el texto y cópialo")});
    },
    closeOut:function(){ui.out=null;render()},
    copyRev:function(){
      var g=ui.revMsg[id],t=g?g.text:"";
      copyText(t,function(){toast("Mensaje copiado")},function(){var ta=document.getElementById("rev-"+id);if(ta){ta.focus();ta.select()}toast("Selecciona el texto y cópialo")});
    },
    qb:function(){
      ui.q[id]=!ui.q[id];
      Array.prototype.forEach.call(document.querySelectorAll('.qhelp'),function(b){if(b.getAttribute("data-k")===id)b.hidden=!ui.q[id]});
      Array.prototype.forEach.call(document.querySelectorAll('[data-a="qb"]'),function(b){if(b.getAttribute("data-id")===id)b.setAttribute("aria-expanded",ui.q[id]?"true":"false")});
    },
    helpOk:function(){S.intro=true;ui.help=false;save();render();window.scrollTo(0,0)},
    helpOpen:function(){ui.help=true;render();window.scrollTo(0,0)},
    clearNews:function(){S.news=[];save();render()},
    saveNow:function(){doSave();copyText(backupCode(),function(){toast("Progreso guardado. Código de respaldo copiado")},function(){toast("Progreso guardado")});render()},
    backupCopy:function(){
      var code=backupCode();
      copyText(code,function(){toast("Código de respaldo copiado")},function(){var ta=document.getElementById("restoreCode");if(ta){ta.value=code;ta.focus();ta.select()}toast("Copia el código del cuadro")});
    },
    restoreGo:function(){var ta=document.getElementById("restoreCode");if(restoreFrom(ta?ta.value:"")){ui.tab="hoy";render();window.scrollTo(0,0);toast("Progreso restaurado")}else toast("Ese código no es válido")},
    redeemAsk:function(){ui.confirm=id;render()},
    redeemOk:function(){redeem(id)},
    closeRedeem:function(){ui.lastRedeem=null;render()},
    fulfill:function(){
      var pi=-1;S.pending.forEach(function(p,i){if(p.rid===id&&pi<0)pi=i});
      if(pi>=0){var pp=S.pending.splice(pi,1)[0];S.log.push({kind:"f",text:"Premio cumplido: "+pp.text,pts:0,day:dayKey(),ts:Date.now()});save();toast("Premio cumplido. Ya puedes canjearlo otra vez");render()}
    },
    delM:function(){S.customM=S.customM.filter(function(c){return c.id!==id});save();render()},
    resetAsk:function(){ui.resetAsk=true;render()},
    resetNo:function(){ui.resetAsk=false;render()},
    resetOk:function(){var cm=S.cmCreated,cr=S.crCreated;S=clean(null);S.cmCreated=cm;S.crCreated=cr;save();netStop();ui.resetAsk=false;ui.lastRedeem=null;ui.out=null;ui.tab="hoy";render();toast("Datos borrados")},
    makeInvite:function(){
      if(!S.pairId){S.pairId=rid();S.pairName="";S.joinCode="";save()}
      sendOut("invite",{age:S.profile.age,rel:S.profile.rel},"Te invito a enlazarnos en Misiones de Amor.");
    },
    readMsg:function(){
      var ta=document.getElementById("inbox"),r=handleMsg(ta?ta.value:"");
      if(!r.ok){toast(r.msg,4500);return}
      toast(r.msg,4500);render();window.scrollTo(0,0);
    },
    cancelCode:function(){S.pairId="";S.joinCode="";S.pairName="";save();netStop();ui.out=null;render()},
    unlinkAsk:function(){ui.unlinkAsk=true;render()},
    unlinkNo:function(){ui.unlinkAsk=false;render()},
    unlinkOk:function(){S.pairId="";S.joinCode="";S.pairName="";S.pairAge=0;S.pairBand="";S.pairRel="";S.proposals=[];S.reviews=[];ui.unlinkAsk=false;ui.out=null;save();netStop();render();toast("Desenlazado")},
    revOk:function(){var i=-1;S.reviews.forEach(function(r,k){if(String(r.eid)===id)i=k});if(i>=0){S.reviews.splice(i,1);save();sendOut("mres",{eid:+id,ok:true},"Te acepté la misión.")}},
    revNo:function(){var i=-1;S.reviews.forEach(function(r,k){if(String(r.eid)===id)i=k});if(i>=0){S.reviews.splice(i,1);save();sendOut("mres",{eid:+id,ok:false},"No te acepté la misión, falta la prueba.")}},
    propOk:function(){var p=S.proposals.filter(function(x){return x.id===id&&x.dir==="in"&&x.status==="nueva"})[0];if(p){p.status="aceptada";save();sendOut("rres",{id:id,res:"ok"},"Acepto tu premio por "+p.cost+" puntos.")}},
    propNo:function(){var p=S.proposals.filter(function(x){return x.id===id&&x.dir==="in"&&x.status==="nueva"})[0];if(p){p.status="rechazada";save();sendOut("rres",{id:id,res:"no"},"No acepto ese premio.")}},
    propCtr:function(){
      var p=S.proposals.filter(function(x){return x.id===id&&x.dir==="in"&&x.status==="nueva"})[0],inp=document.getElementById("ctr-"+id);
      if(!p||!inp)return;
      var c=validCost(inp.value);
      if(!c){toast("Elige un precio de 150 a 500 (tranquilo) o de 600 a 1500 (fuerte)",4000);return}
      if(c===p.cost){toast("Ese es el mismo precio. Mejor toca Aceptar");return}
      p.status="contra";p.counter=c;save();sendOut("rres",{id:id,res:"counter",cost:c},"Acepto tu premio si cuesta "+c+" puntos en vez de "+p.cost+".");
    },
    finOk:function(){var p=S.proposals.filter(function(x){return x.id===id&&x.dir==="out"&&x.status==="contra"})[0];if(p){p.status="aceptada";p.cost=p.counter;S.customR.push({id:"x"+p.id,text:p.text,cost:p.counter});save();sendOut("rfin",{id:id,res:"ok",cost:p.counter},"Perfecto, acepto el nuevo precio de "+p.counter+" puntos.")}},
    finNo:function(){var p=S.proposals.filter(function(x){return x.id===id&&x.dir==="out"&&x.status==="contra"})[0];if(p){p.status="cancelada";save();sendOut("rfin",{id:id,res:"no"},"Mejor no, cancelo el premio.")}}
  };
  if(A[a])A[a]();
});
function onPick(ev){
  var t=ev.target;
  if(t.id==="rType"){var st=t.value==="f",ci=document.getElementById("rCost");ci.min=st?600:150;ci.max=st?1500:500;ci.value=st?800:200;return}
  if(t.id!=="proofFile")return;
  var f=t.files&&t.files[0];if(!f||!ui.proof||ui.proofBusy||ui.lastFile===f)return;ui.lastFile=f;
  var pid=ui.proof;ui.proofBusy=true;ui.proofData=null;render();
  ui.proofErr="";
  readProof(f,function(data,err,hex){
    if(ui.proof!==pid)return;
    ui.proofBusy=false;ui.proofData=null;ui.proofHash="";
    if(err)ui.proofErr=err;
    else if(dupProof(hex))ui.proofErr="Esa foto ya la usaste como prueba. Sube una foto nueva.";
    else{ui.proofData=data;ui.proofHash=hex}
    render();
  });
}
document.addEventListener("change",onPick);
document.addEventListener("input",function(ev){if(ev.target&&ev.target.id==="proofFile")onPick(ev)});
document.addEventListener("input",function(ev){
  var t=ev.target;if(!t.id||t.id.slice(-3)!=="Age")return;
  var px=t.id.slice(0,-3),age=parseInt(t.value,10),h=document.getElementById(px+"Hint"),rel=document.getElementById(px+"Rel");
  if(h)h.textContent=ageHint(age);
  if(rel){
    for(var i=0;i<rel.options.length;i++){var o=rel.options[i];o.disabled=!!(age&&age<13&&isRom(o.value))}
    if(rel.options[rel.selectedIndex].disabled)rel.value="amigos";
  }
});
document.addEventListener("submit",function(ev){
  ev.preventDefault();var f=ev.target.id;
  if(f==="joinForm"){
    var jc=(document.getElementById("jCode").value||"").trim();
    if(!/^[A-Za-z0-9]{6,20}$/.test(jc)){toast("Escribe el código completo, solo letras y números.",4000);return}
    if(S.pairId){toast("Ya tienes un código creado. Cancélalo primero.",4000);return}
    S.joinCode=jc;save();netListen();toast("Buscando a tu pareja…",3000);render();return;
  }
  if(f==="regForm"||f==="pfForm"){
    var err=applyProfile(f==="regForm"?"reg":"pf");
    if(err){toast(err,4500);return}
    toast(f==="regForm"?"Listo, a jugar":"Perfil guardado");render();window.scrollTo(0,0);
  }
  else if(f==="mForm"){
    var t=document.getElementById("mText").value.trim(),p=Math.max(1,Math.min(20,parseInt(document.getElementById("mPts").value,10)||10));
    if(!t)return;
    if(!isClean(t)){toast(NO_MALO,4500);return}
    if(cmLeft()<=0){toast("Ya agregaste tus 5 misiones de esta semana");return}
    S.customM.push({id:"c"+Date.now(),cat:document.getElementById("mCat").value,text:t,pts:p});S.cmCreated.push(Date.now());save();render();toast("Misión agregada")}
  else if(f==="sendMForm"){
    var st=document.getElementById("sText").value.trim(),sp=Math.max(1,Math.min(20,parseInt(document.getElementById("sPts").value,10)||10)),sc=document.getElementById("sCat").value;
    if(!st)return;
    if(!isClean(st)){toast(NO_MALO,4500);return}
    if(cmLeft()<=0){toast("Ya agregaste tus 5 misiones de esta semana");return}
    S.cmCreated.push(Date.now());save();
    sendOut("mission",{text:st,cat:sc,pts:sp},"Te puse una misión: \""+st+"\" (+"+sp+" puntos).");
  }
  else if(f==="propForm"){
    var rt=document.getElementById("rText").value.trim(),strong=document.getElementById("rType").value==="f";
    var lo=strong?600:150,hi=strong?1500:500,c=Math.max(lo,Math.min(hi,parseInt(document.getElementById("rCost").value,10)||lo));
    if(!rt)return;
    if(!isClean(rt)){toast(NO_MALO,4500);return}
    if(crLeft()<=0){toast("Ya agregaste tus 10 premios de esta semana");return}
    var pid="p"+rid();
    S.proposals.push({id:pid,dir:"out",text:rt.slice(0,90),cost:c,status:"esperando",from:S.me});S.crCreated.push(Date.now());save();
    sendOut("rprop",{id:pid,text:rt.slice(0,90),cost:c},"Quiero proponer este premio: \""+rt.slice(0,90)+"\" por "+c+" puntos. ¿Lo aceptas?");
  }
});
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"){doSave();return}
  var lost=settle();if(lost>0){toast("Perdiste tu racha: "+lost+" puntos menos",4500)}
  if(ui.proof||ui.proofBusy)return;
  var ae=document.activeElement;if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA"||ae.tagName==="SELECT"))return;
  render();
});
window.addEventListener("pagehide",doSave);
var lost0=S.profile.ok?settle():0;
netInit();
render();
if(lost0>0)toast("Perdiste tu racha: "+lost0+" puntos menos",4500);
})();
</script>
